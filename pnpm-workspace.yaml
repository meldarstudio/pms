packages:
  - apps/*
  - packages/*

catalog:
  cf: 1.0.0-rc.1
  typescript: ^7.0.2
  zod: ^4.6.5
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0"
  - vite-plus@1.3.0
  - "@better-auth/core@1.7.13"
  - "@better-auth/drizzle-adapter@1.7.13"
  - "@better-auth/kysely-adapter@1.7.13"
  - "@better-auth/memory-adapter@1.7.13"
  - "@better-auth/mongo-adapter@1.7.13"
  - "@better-auth/prisma-adapter@1.7.13"
  - "@better-auth/telemetry@1.7.13"
  - better-auth@1.7.13
  - "@tailwindcss/node@4.3.4"
  - "@tailwindcss/oxide-android-arm64@4.3.4"
  - "@tailwindcss/oxide-darwin-arm64@4.3.4"
  - "@tailwindcss/oxide-darwin-x64@4.3.4"
  - "@tailwindcss/oxide-freebsd-x64@4.3.4"
  - "@tailwindcss/oxide-linux-arm-gnueabihf@4.3.4"
  - "@tailwindcss/oxide-linux-arm64-gnu@4.3.4"
  - "@tailwindcss/oxide-linux-arm64-musl@4.3.4"
  - "@tailwindcss/oxide-linux-x64-gnu@4.3.4"
  - "@tailwindcss/oxide-linux-x64-musl@4.3.4"
  - "@tailwindcss/oxide-wasm32-wasi@4.3.4"
  - "@tailwindcss/oxide-win32-arm64-msvc@4.3.4"
  - "@tailwindcss/oxide-win32-x64-msvc@4.3.4"
  - "@tailwindcss/oxide@4.3.4"
  - "@tailwindcss/vite@4.3.4"
  - astro@7.4.5
  - tailwindcss@4.3.4
packageExtensions:
  "@astrojs/check@0.9.12":
    dependencies:
      typescript: 6.0.3
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": 1.11.3
  "svelte-check@4.7.8":
    dependencies:
      typescript: 6.0.3
permissions:
  '@ui-sdk/core':
    skills: true
