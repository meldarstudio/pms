packages:
  - apps/*
  - packages/*

catalog:
  typescript: ^7.0.2
  zod: ^4.6.5
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

allowBuilds:
  esbuild: true
  workerd: true
overrides:
