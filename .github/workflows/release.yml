name: Release production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA on main (validated before deployment)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pms-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select exact production revision
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$REQUESTED_SHA^{commit}"
          git merge-base --is-ancestor "$REQUESTED_SHA" refs/remotes/origin/main
          git checkout --detach "$REQUESTED_SHA"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          printf 'Pinned release SHA: %s\n' "$REQUESTED_SHA"
          # Cloudflare caps version tags at 25 characters and messages at 100.
          export LC_ALL=C.UTF-8
          message="${REQUESTED_SHA:0:7} $(git log -1 --format=%s "$REQUESTED_SHA")"
          {
            printf 'RELEASE_TAG=%s\n' "${REQUESTED_SHA:0:7}"
            printf 'RELEASE_MESSAGE=%s\n' "${message:0:100}"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        # Reads packageManager from the selected revision; never installs dependencies.
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

      - env:
          VITE_API_BASE_URL: https://api.hotelmanantialchurin.com
        run: pnpm build

      - name: Bundle API without deploying
        run: pnpm --filter @pms/backend exec cf deploy --dry-run

      - name: Verify production migration readiness (read only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
        run: node apps/backend/scripts/check-production-readiness.mjs

      - name: Deploy API code
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: pnpm --filter @pms/backend run deploy --tag "$RELEASE_TAG" --message "$RELEASE_MESSAGE"

      - name: Deploy built portal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: pnpm --filter @pms/portal run deploy --tag "$RELEASE_TAG" --message "$RELEASE_MESSAGE"

      - name: Deploy public website
        env:
          PUBLIC_PMS_API_URL: https://api.hotelmanantialchurin.com
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CULQI_PUBLIC_KEY: ${{ vars.PUBLIC_CULQI_PUBLIC_KEY }}
        run: pnpm --filter @pms/website run deploy --tag "$RELEASE_TAG" --message "$RELEASE_MESSAGE"
