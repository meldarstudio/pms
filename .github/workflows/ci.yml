name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

      - name: Build production portal
        env:
          VITE_API_BASE_URL: https://api.hotelmanantialchurin.com
        run: pnpm build

      - name: Bundle API without deploying
        env:
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_WRITE_LOGS: "false"
        run: pnpm --filter @pms/backend exec wrangler deploy --dry-run --minify
